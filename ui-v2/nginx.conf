# WR-01 (1205 review): per-client-address rate limit on the credential-taking
# auth routes, in front of the in-process failure throttle in data-service.
# The key is empty (= not limited) for every other URI, so the one proxied
# /data-service/ location below carries the limit without a second proxy block.
map $uri $dg_auth_limit_key {
  default "";
  ~^/data-service/auth/(login|password|accept-invite)$ $binary_remote_addr;
}
limit_req_zone $dg_auth_limit_key zone=dg_auth:10m rate=5r/s;

server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  # Phase 1205 (D-06/D-08): the browser reaches graph data only through
  # /data-service. Direct Neo4j and n8n proxies are removed; these tombstones
  # keep the SPA try_files fallback from ever answering 200 for those paths.
  location ^~ /neo4j {
    return 404;
  }

  location ^~ /n8n {
    return 404;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri /index.html;
  }

  location /llm/ {
    set $ds_upstream http://data-service:8000;
    proxy_pass $ds_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /reasoner/ {
    set $ds_upstream http://data-service:8000;
    proxy_pass $ds_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /data-service/ {
    limit_req zone=dg_auth burst=10 nodelay;
    limit_req_status 429;
    set $ds_upstream http://data-service:8000;
    rewrite ^/data-service/(.*) /$1 break;
    proxy_pass $ds_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
