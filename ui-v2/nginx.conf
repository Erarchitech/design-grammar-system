# WR-01 / WR-22 (1205 review): per-client-address rate limit on the
# credential-taking auth routes, in front of the in-process failure throttle in
# data-service. It is applied in a dedicated regex location below, not through a
# `map $uri`: the /data-service/ location rewrites $uri before the limit is
# evaluated, so a map keyed on the public path never matched and nothing was
# limited. A regex location matches the decoded, slash-merged request path, so
# `%6Cogin` and `//` spellings hit it too.
limit_req_zone $binary_remote_addr zone=dg_auth:10m rate=5r/s;

server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # WR-23: real_ip directives written by entrypoint.sh from DG_TRUSTED_PROXIES
  # (empty when unset, so X-Forwarded-For is never trusted by default).
  include /etc/nginx/dg-realip.conf;

  root /usr/share/nginx/html;
  index index.html;

  # WR-16 (1205 review): baseline response headers. The CSP carries only the
  # directives that cannot break the SPA (framing, <base>, plugins, form
  # targets); a script/style/connect policy needs a browser pass against the
  # Speckle viewer and is left to the owner. nginx does not inherit server-level
  # add_header into a location that declares its own, so `location /` repeats
  # them below.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

  # Phase 1205 (D-06/D-08): the browser reaches graph data only through
  # /data-service. Direct Neo4j and n8n proxies are removed; these tombstones
  # keep the SPA try_files fallback from ever answering 200 for those paths.
  location ^~ /neo4j {
    return 404;
  }

  location ^~ /n8n {
    return 404;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    try_files $uri /index.html;
  }

  location /llm/ {
    set $ds_upstream http://data-service:8000;
    proxy_pass $ds_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /reasoner/ {
    set $ds_upstream http://data-service:8000;
    proxy_pass $ds_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Credential routes: rate limited per client address (5 r/s, burst 10). A regex
  # location outranks the /data-service/ prefix location below, so the proxy
  # settings are repeated here.
  location ~ ^/data-service/auth/(login|password|accept-invite|register)/?$ {
    limit_req zone=dg_auth burst=10 nodelay;
    limit_req_status 429;
    set $ds_upstream http://data-service:8000;
    rewrite ^/data-service/(.*) /$1 break;
    proxy_pass $ds_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Phase 1301-08 (D-16, D-18): the DeGram model relay streams server-sent
  # events, so this prefix location (longer than /data-service/, so it wins)
  # turns buffering off and speaks HTTP/1.1 upstream. proxy_read_timeout is
  # above the relay's own 300 s total limit, so the relay reports its named
  # PROVIDER_TIMEOUT instead of nginx cutting the stream first. The body limit
  # equals the relay's 1 MiB ceiling. It declares no add_header, so the
  # server-level security headers above are inherited. The relay is reached only
  # through /data-service/degram/v1/; /llm/ never routes to it.
  location /data-service/degram/v1/ {
    set $ds_upstream http://data-service:8000;
    rewrite ^/data-service/(.*) /$1 break;
    proxy_pass $ds_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 330s;
    proxy_send_timeout 60s;
    client_max_body_size 1m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Phase 1301-09 (D-21, DGCL-03): Model Viewer geometry is streamed by data-service's
  # project-authorised Speckle proxy, so the browser never holds a Speckle token. Object
  # batches are large and streamed, hence no buffering and HTTP/1.1 upstream;
  # proxy_read_timeout is above the proxy's own 60 s upstream read limit so it reports
  # its named SPECKLE_UPSTREAM_ERROR first; the 4m body limit covers a 20000-id batch
  # (the proxy's own ceiling is 4 MiB). It declares no add_header, so the server-level
  # security headers are inherited, and it names no Speckle upstream: Speckle is reached
  # only from data-service.
  location /data-service/speckle-proxy/ {
    set $ds_upstream http://data-service:8000;
    rewrite ^/data-service/(.*) /$1 break;
    proxy_pass $ds_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 90s;
    proxy_send_timeout 60s;
    client_max_body_size 4m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Phase 1303-15: a property check re-places the Grasshopper chain and waits for the Rhino.Inside solution;
  # that outlived nginx's default 60 s (DeGram got 504, live 2026-10-21).
  location /data-service/scripts/ {
    set $ds_upstream http://data-service:8000;
    rewrite ^/data-service/(.*) /$1 break;
    proxy_pass $ds_upstream;
    proxy_read_timeout 240s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # A mapping session carries up to 5000 element descriptors with every instance and type parameter
  # (Revit, Grasshopper), several MiB for a real model view. The 1 MiB default answered 413 and the
  # Revit connector saw only a reset connection (stand, 2026-10-29). data-service caps the element count.
  location /data-service/mapping/ {
    set $ds_upstream http://data-service:8000;
    rewrite ^/data-service/(.*) /$1 break;
    proxy_pass $ds_upstream;
    client_max_body_size 64m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /data-service/ {
    set $ds_upstream http://data-service:8000;
    rewrite ^/data-service/(.*) /$1 break;
    proxy_pass $ds_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
