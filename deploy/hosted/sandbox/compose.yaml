services:
  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?required}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - graph:/data
    mem_limit: 1500m
    cpus: 1.0
    pids_limit: 256
    networks: [sandbox]
  data-service:
    build:
      context: ../../../data-service
    environment:
      DG_DATA_DIR: /app/data
      DG_KNOWLEDGE_REPO_ROOT: /mnt/repo
      DG_DEPLOYMENT: multi-user
      DG_ALLOW_SELF_REGISTRATION: "false"
      DG_COOKIE_SECURE: "false"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?required}
      NEO4J_DATABASE: neo4j
      NEO4J_PUBLIC_URI: bolt://neo4j:7687
      LLM_MASTER_SECRET: ${LLM_MASTER_SECRET:?required}
      DG_SERVICE_TOKEN: ${DG_SERVICE_TOKEN:?required}
      DG_BOOTSTRAP_ADMIN_USER: sandbox-admin
      DG_BOOTSTRAP_ADMIN_PASSWORD: ${DG_BOOTSTRAP_ADMIN_PASSWORD:?required}
      DG_REASONER_URL: http://127.0.0.1:9
      SPECKLE_BASE_URL: http://127.0.0.1:9
      N8N_INTERNAL_URL: http://n8n:5678
      OLLAMA_URL: http://127.0.0.1:9
    depends_on: [neo4j]
    volumes:
      - api_state:/app/data
      - ../ingest:/mnt/repo/hosted-ingest:ro
      - ./probe.py:/app/sandbox_probe.py:ro
      - ../../../llm/cypher_catalog.json:/mnt/repo/llm/cypher_catalog.json:ro
      - ../../../llm/structure_rules.json:/mnt/repo/llm/structure_rules.json:ro
      - ../../../ontology/DesignGrammar-V7.owl:/mnt/repo/ontology/DesignGrammar-V7.owl:ro
      - ../../../ontology/export_to_markdown_v7.py:/mnt/repo/ontology/export_to_markdown_v7.py:ro
      - ../../../spec/evidence-contract.schema.json:/mnt/repo/spec/evidence-contract.schema.json:ro
    mem_limit: 1250m
    cpus: 1.0
    pids_limit: 256
    networks: [sandbox]
  n8n:
    image: n8nio/n8n:2.4.8
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?required}
      N8N_RESTRICT_FILE_ACCESS_TO: /files/workflows
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    volumes:
      - n8n_state:/home/node/.n8n
      - ../../../n8n/workflows/sandbox-file-read.json:/files/workflows/sandbox-file-read.json:ro
      - ../../../n8n/workflows/sandbox-file-denied.json:/files/workflows/sandbox-file-denied.json:ro
    mem_limit: 1250m
    cpus: 1.0
    pids_limit: 256
    networks: [sandbox]
networks:
  sandbox:
    internal: true
    enable_ipv6: false
volumes:
  graph: {}
  api_state: {}
  n8n_state: {}
