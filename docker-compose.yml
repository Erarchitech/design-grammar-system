services:

  neo4j:
    build: ./neo4j
    container_name: neo4j
    # Phase 1205 (D-09): loopback only. The multi-user override drops both publishes.
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env (see .env.example)}
      NEO4J_dbms_connector_bolt_listen__address: "0.0.0.0:7687"
      NEO4J_dbms_connector_bolt_advertised__address: "localhost:7687"
      NEO4J_dbms_connector_bolt_tls__level: "DISABLED"
      NEO4J_dbms_security_procedures_unrestricted: "n10s.*,apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "n10s.*,apoc.*"
    volumes:
      - neo4j_data:/data

  dg-reasoner:
    build: ./dg-reasoner
    container_name: dg-reasoner
    # Phase 1201 (D-11): host-exposed so the DE-01 runner, which executes on the
    # host, can reach this leg. Without it the leg reports available:false and the
    # four-leg gate can never be exercised -- an unreachable leg is indistinguishable
    # from a passing one at the gate, which is the failure mode DE-01 exists to catch.
    # Phase 1205 (D-09): the host publish is localhost-only.
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env (see .env.example)}
      DG_REASONER_TIMEOUT_SECONDS: 90
    volumes:
      - ./ontology:/app/ontology:ro
      # Phase 1200 (D-09): dg-reasoner has no repo-root mount, unlike
      # data-service's `.:/mnt/repo:ro`, so the shared golden fixture would
      # otherwise be invisible inside this container.
      - ./fixtures:/app/fixtures:ro
    depends_on:
      - neo4j

  data-service:
    build: ./data-service
    container_name: data-service
    # Phase 1205 (D-09): localhost-only; Grasshopper on the host still reaches it.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DG_DATA_DIR: /app/data
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env (see .env.example)}
      # Phase 825 (CONNG-03): host-facing bolt URI returned in the connector
      # heartbeat bundle. NEO4J_URI above is the Docker-internal address used by
      # data-service itself; off-Docker connectors (e.g. Grasshopper on the host)
      # get this one instead so they can actually reach Neo4j.
      NEO4J_PUBLIC_URI: bolt://localhost:7687
      NEO4J_DATABASE: neo4j
      SPECKLE_BASE_URL: http://localhost:8090
      SPECKLE_INTERNAL_URL: http://speckle-ingress:8080
      SPECKLE_WRITE_TOKEN: ${SPECKLE_WRITE_TOKEN:-}
      SPECKLE_READ_TOKEN: ${SPECKLE_READ_TOKEN:-}
      SPECKLE_PROJECT_ID: ${SPECKLE_PROJECT_ID:-}
      SPECKLE_BASE_MODEL_ID: ${SPECKLE_BASE_MODEL_ID:-}
      DG_BASE_URL: http://localhost:8080
      DG_KNOWLEDGE_REPO_ROOT: /mnt/repo
      N8N_INTERNAL_URL: http://n8n:5678
      LLM_MASTER_SECRET: ${LLM_MASTER_SECRET:?set LLM_MASTER_SECRET in .env (see .env.example)}
      # Phase 1205 (D-01/D-05/D-07): service token, first-admin bootstrap
      # identity and the deployment profile. Secrets come from the gitignored .env.
      DG_SERVICE_TOKEN: ${DG_SERVICE_TOKEN:?set DG_SERVICE_TOKEN in .env (see .env.example)}
      DG_BOOTSTRAP_ADMIN_USER: ${DG_BOOTSTRAP_ADMIN_USER:?set DG_BOOTSTRAP_ADMIN_USER in .env (see .env.example)}
      DG_BOOTSTRAP_ADMIN_PASSWORD: ${DG_BOOTSTRAP_ADMIN_PASSWORD:?set DG_BOOTSTRAP_ADMIN_PASSWORD in .env (see .env.example)}
      DG_DEPLOYMENT: ${DG_DEPLOYMENT:-local}
      DG_COOKIE_SECURE: ${DG_COOKIE_SECURE:-false}
      DG_REASONER_URL: http://dg-reasoner:8000
      # Phase 33 (BRDG-02): DG CANVAS LISTENER bridge -- the Windows-host
      # Grasshopper process is reached via host.docker.internal, not a
      # compose service name (it isn't containerized).
      GH_BRIDGE_HOST: host.docker.internal
      GH_BRIDGE_PORT: "8720"
    volumes:
      - ./data-service/data:/app/data
      - .:/mnt/repo:ro
    extra_hosts:
      # host-gateway resolves host.docker.internal on Linux hosts; harmless
      # no-op on Docker Desktop (Windows/Mac), which already provides it.
      - "host.docker.internal:host-gateway"
    depends_on:
      - neo4j
      - speckle-ingress

  n8n:
    image: n8nio/n8n
    container_name: n8n
    # Phase 1205 (D-09): loopback only. The multi-user override drops this publish.
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:?set N8N_USER in .env (see .env.example)}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:?set N8N_PASSWORD in .env (see .env.example)}
      # Phase 1205 (1205-05 workflows): read the service token and Neo4j
      # credentials from $env rather than from literals baked into workflow JSON.
      DG_SERVICE_TOKEN: ${DG_SERVICE_TOKEN:?set DG_SERVICE_TOKEN in .env (see .env.example)}
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env (see .env.example)}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.1:latest
      NEO4J_URL: http://neo4j:7474
    depends_on:
      - data-service
      - ollama
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/files

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  design-grammars:
    # v8.0: the container now serves the V2 UI (ui-v2/); the legacy dark SPA
    # is archived at graph-viewer/ — see docs/RELEASE-NOTES-v8.0.md
    build: ./ui-v2
    container_name: design-grammars
    ports:
      - "8080:80"
    # Phase 1205 (D-12): the UI container receives no Neo4j, n8n or Speckle-token
    # credentials; the browser reaches everything through data-service.
    environment:
      DATA_SERVICE_URL: /data-service
      SPECKLE_BASE_URL: http://localhost:8090
    depends_on:
      - data-service

  speckle-postgres:
    image: postgres:16.4-alpine3.20
    container_name: speckle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: speckle
      POSTGRES_USER: speckle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - speckle_postgres_data:/var/lib/postgresql/data
      - ./speckle/bootstrap-local.sql:/docker-entrypoint-initdb.d/20-bootstrap-local.sql:ro

  speckle-redis:
    image: valkey/valkey:8.1-alpine
    container_name: speckle-redis
    restart: unless-stopped
    volumes:
      - speckle_redis_data:/data

  speckle-minio:
    image: minio/minio
    container_name: speckle-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (see .env.example)}
    # Phase 1205 (D-09): loopback only (residual: no remote blob access in multi-user).
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - speckle_minio_data:/data

  speckle-server:
    image: speckle/speckle-server:latest
    container_name: speckle-server
    restart: unless-stopped
    environment:
      CANONICAL_URL: http://localhost:8090
      PRIVATE_OBJECTS_SERVER_URL: http://speckle-server:3000
      SESSION_SECRET: ${SPECKLE_SESSION_SECRET:?set SPECKLE_SESSION_SECRET in .env (see .env.example)}
      STRATEGY_LOCAL: "true"
      LOG_LEVEL: info
      LOG_PRETTY: "true"
      POSTGRES_URL: speckle-postgres
      POSTGRES_USER: speckle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: speckle
      REDIS_URL: redis://speckle-redis
      PREVIEW_SERVICE_USE_PRIVATE_OBJECTS_SERVER_URL: "true"
      PREVIEW_SERVICE_REDIS_URL: redis://speckle-redis
      FILEIMPORT_SERVICE_USE_PRIVATE_OBJECTS_SERVER_URL: "true"
      FILEIMPORT_SERVICE_REDIS_URL: redis://speckle-redis
      S3_ENDPOINT: http://speckle-minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env (see .env.example)}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (see .env.example)}
      S3_BUCKET: speckle-server
      S3_CREATE_BUCKET: "true"
      FILE_SIZE_LIMIT_MB: 1000
      EMAIL_FROM: no-reply@example.org
      EMAIL_SECURE: "false"
      EMAIL_REQUIRE_TLS: "false"
      FRONTEND_ORIGIN: http://localhost:8090
      ONBOARDING_STREAM_URL: https://latest.speckle.systems/projects/843d07eb10
      FILEIMPORT_QUEUE_POSTGRES_URL: postgresql://speckle:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@speckle-postgres/speckle
      FF_NEXT_GEN_FILE_IMPORTER_ENABLED: "true"
    depends_on:
      - speckle-postgres
      - speckle-redis
      - speckle-minio

  speckle-frontend-2:
    image: speckle/speckle-frontend-2:latest
    container_name: speckle-frontend-2
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_SERVER_NAME: local
      NUXT_PUBLIC_API_ORIGIN: http://localhost:8090
      NUXT_PUBLIC_BASE_URL: http://localhost:8090
      NUXT_PUBLIC_BACKEND_API_ORIGIN: http://speckle-server:3000
      NUXT_PUBLIC_LOG_LEVEL: warn
      NUXT_REDIS_URL: redis://speckle-redis
      LOG_LEVEL: info
      LOG_PRETTY: "true"
      NUXT_PUBLIC_FF_LARGE_FILE_IMPORTS_ENABLED: "true"
      NUXT_PUBLIC_FF_NEXT_GEN_FILE_IMPORTER_ENABLED: "true"
    depends_on:
      - speckle-server
      - speckle-redis

  speckle-preview-service:
    image: speckle/speckle-preview-service:latest
    container_name: speckle-preview-service
    restart: unless-stopped
    environment:
      HOST: 127.0.0.1
      PORT: "3001"
      LOG_LEVEL: info
      LOG_PRETTY: "true"
      REDIS_URL: redis://speckle-redis
    depends_on:
      - speckle-redis

  speckle-webhook-service:
    image: speckle/speckle-webhook-service:latest
    container_name: speckle-webhook-service
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      LOG_PRETTY: "true"
      PG_CONNECTION_STRING: postgres://speckle:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@speckle-postgres/speckle
    depends_on:
      - speckle-postgres
      - speckle-server

  speckle-fileimport-service:
    image: speckle/speckle-fileimport-service:latest
    container_name: speckle-fileimport-service
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      LOG_PRETTY: "true"
      SPECKLE_SERVER_URL: http://speckle-server:3000
      PG_CONNECTION_STRING: postgres://speckle:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@speckle-postgres/speckle
      REDIS_URL: redis://speckle-redis
    depends_on:
      - speckle-postgres
      - speckle-redis
      - speckle-server

  speckle-ingress:
    image: speckle/speckle-docker-compose-ingress:latest
    container_name: speckle-ingress
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      FILE_SIZE_LIMIT_MB: "100"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    depends_on:
      - speckle-server
      - speckle-frontend-2

volumes:
  neo4j_data:
  n8n_data:
  ollama:
  speckle_postgres_data:
  speckle_redis_data:
  speckle_minio_data:
